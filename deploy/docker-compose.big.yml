# Réglages du serveur 192.168.1.58 (i7-4790K, 8 threads, 30 Go) : copié là-bas en ~/photos/docker-compose.override.yml,
# que docker compose charge tout seul. Jamais sur la Freebox (2 Go) : photos-switch ne recopie pas ce fichier.
services:
  postgres:
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "effective_cache_size=8GB", "-c", "work_mem=32MB",
              "-c", "maintenance_work_mem=1GB", "-c", "max_connections=30"]

  api:
    environment: &big
      MALLOC_ARENA_MAX: "4"
      VIPS_CONCURRENCY: "4"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      IMPORT_BACKLOG_PAUSE: "1000000"   # assez de RAM pour import NAS + IA en même temps : ml_gate ne met plus l'IA en pause
      ML_WORKER: main@photos            # ml_gate n'ajoute la file `ml` qu'au worker principal, pas à worker-vlm
      # Recherche par texte avec un CLIP plus gros (multilingue, 1024 dims, ~1 s par photo, ~5 Go de RAM), EN PLUS
      # de xlm-roberta-base-ViT-B-32 que la Freebox continue d'utiliser. L'API ne s'en sert qu'une fois toute la
      # bibliothèque rattrapée (housekeeping, 15 min) ; avant, et sur la Freebox, recherche avec le modèle de base.
      SEARCH_CLIP_ARCH: xlm-roberta-large-ViT-H-14
      SEARCH_CLIP_PRETRAINED: frozen_laion5b_s13b_b90k
      # Visages cherchés sur l'original (jusqu'à 4096 px) au lieu de la miniature 1440 px, détecteur en 1280.
      # Mesuré (Solvay 1927, 29 visages) : groupe 11 -> 29 ; même groupe vu de loin 0 -> 29 ; ~1,2 Go, même durée.
      # Les photos analysées avant (ou sur la Freebox) sont reprises en arrière-plan, sans rien supprimer.
      FACE_SOURCE_PX: "4096"
      FACE_DET_SIZE: "1280"
      # Descriptions + texte des photos par Ollama, en local, sur toute la bibliothèque. Sur la Freebox, .env reste
      # maître (off ou gemini) : les tâches Ollama rendues avec la file Redis y sont ignorées (tasks.describe).
      VLM_PROVIDER: ollama
      OLLAMA_MODEL: qwen3-vl:4b-instruct   # 3,3 Go ; qwen3-vl:8b-instruct (6 Go) : meilleur, ~2x plus lent
      OLLAMA_NUM_THREAD: "4"            # les 4 cœurs physiques ; CLIP et visages gardent de la marge
      VLM_RATE_LIMIT: ""                # pas de quota : le CPU est la seule limite
      VLM_HOURLY_BUDGET: "600"          # taille de la file vlm, complétée chaque heure (≈ 1 h de GPU à ~6 s/photo ; 100 sur CPU)

  worker:
    environment: *big
    # La file vlm a son propre worker : une description (~20 s) ou une vidéo souvenir (10-20 min) n'occupe pas
    # un thread d'import ou de recherche.
    command: ["celery", "-A", "tasks", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-n", "main@photos",
              "-Q", "query,media", "--pool", "threads", "-c", "6"]
    mem_limit: 16g
    memswap_limit: 20g

  worker-vlm:
    image: photos-server   # construite par worker/api (build -q worker api) : ne jamais la chercher sur Docker Hub
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *big
      DATABASE_URL: postgresql://photos:${POSTGRES_PASSWORD}@postgres/photos
      REDIS_URL: redis://redis:6379/0
      PHOTOS_DIR: /photos
      QUARANTINE_DIR: /photos/.quarantine
      THUMBS_DIR: /thumbs
      OLLAMA_URL: http://ollama:11434
    volumes:   # mêmes montages que worker (docker-compose.yml) : les vidéos souvenirs lisent originaux et musique
      - type: bind
        source: ${PHOTOS_HOST_DIR:?chemin du montage NAS requis}
        target: /photos
        bind:
          create_host_path: false
      - ${THUMBS_HOST_DIR:-./data/thumbs}:/thumbs
      - ${IMPORT_HOST_DIR:-./data/import}:/import:ro
    # Un seul consommateur, un seul thread : Ollama traite une image à la fois. Pas de beat (-B) : il est dans worker.
    command: ["celery", "-A", "tasks", "worker", "-n", "vlm@photos", "-Q", "vlm", "--pool", "threads", "-c", "1"]
    depends_on: [postgres, redis, ollama, worker]
    mem_limit: 3g

  ollama:
    profiles: !reset []   # le profil « ollama » du fichier principal : toujours actif ici
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    mem_limit: 10g
    # RTX 2080 Ti (11 Go de VRAM) : pilote NVIDIA 595-open + NVIDIA Container Toolkit installés le 16/11/2026
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
