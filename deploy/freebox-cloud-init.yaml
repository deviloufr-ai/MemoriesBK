#cloud-config
# À coller tel quel dans « cloud-init user-data » à la création de la VM Freebox (Ubuntu ARM64).
# Connexion ensuite : ssh freebox@<ip-de-la-vm>  (clé uniquement, pas de mot de passe)
timezone: Europe/Paris

users:
  - name: freebox
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"   # pas de mot de passe sur ce compte : sudo sans mot de passe
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFao2jzyQjkplLZcAklraxJOZVhLdU64WdEAZ+X2YU/T dashwheel-pc

ssh_pwauth: false

# 2 Go de RAM : le swap absorbe le chargement des modèles CLIP / visages
swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl

write_files:
  # Le 11/11, networkd est resté « Failed » après un gel mémoire : bail DHCP non renouvelé, VM hors réseau.
  - path: /usr/local/bin/net-watchdog
    permissions: "0755"
    content: |
      #!/bin/sh
      ping -c 3 -W 3 192.168.1.254 >/dev/null 2>&1 && exit 0
      logger -t net-watchdog "passerelle injoignable : relance du réseau"
      networkctl reconfigure enp0s5 || systemctl restart systemd-networkd
  - path: /etc/systemd/system/net-watchdog.service
    content: |
      [Unit]
      Description=Relance le reseau si la passerelle ne repond plus
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/net-watchdog
  - path: /etc/systemd/system/net-watchdog.timer
    content: |
      [Unit]
      Description=Verifie le reseau toutes les 2 minutes
      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=2min
      [Install]
      WantedBy=timers.target

runcmd:
  - systemctl daemon-reload && systemctl enable --now net-watchdog.timer
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker freebox
  - systemctl enable --now docker
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' > /etc/sysctl.d/99-photos.conf
  - mkdir -p /srv/photos && chown freebox:freebox /srv/photos
  - touch /var/lib/cloud/instance/photos-ready
