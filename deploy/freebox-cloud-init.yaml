#cloud-config
# À coller tel quel dans « cloud-init user-data » à la création de la VM Freebox (Ubuntu ARM64).
# Connexion ensuite : ssh freebox@<ip-de-la-vm>  (clé uniquement, pas de mot de passe)
timezone: Europe/Paris

users:
  - name: freebox
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"   # pas de mot de passe sur ce compte : sudo sans mot de passe
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFao2jzyQjkplLZcAklraxJOZVhLdU64WdEAZ+X2YU/T dashwheel-pc

ssh_pwauth: false

# 2 Go de RAM : le swap absorbe le chargement des modèles CLIP / visages
swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl

write_files:
  # Le 11/11, networkd est resté « Failed » après un gel mémoire : bail DHCP non renouvelé, VM hors réseau.
  - path: /usr/local/bin/net-watchdog
    permissions: "0755"
    content: |
      #!/bin/sh
      ping -c 3 -W 3 192.168.1.254 >/dev/null 2>&1 && exit 0
      logger -t net-watchdog "passerelle injoignable : relance du réseau"
      networkctl reconfigure enp0s5 || systemctl restart systemd-networkd
  - path: /etc/systemd/system/net-watchdog.service
    content: |
      [Unit]
      Description=Relance le reseau si la passerelle ne repond plus
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/net-watchdog
  - path: /etc/systemd/system/net-watchdog.timer
    content: |
      [Unit]
      Description=Verifie le reseau toutes les 2 minutes
      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=2min
      [Install]
      WantedBy=timers.target
  # Sauvegarde de la base (noms, familles, albums, partages : rien de tout ça n'est sur le NAS) : chaque nuit, 14 jours.
  # Restauration : docker compose exec -T postgres pg_restore -U photos -d photos --clean --if-exists < fichier.dump
  - path: /usr/local/bin/photos-backup
    permissions: "0755"
    content: |
      #!/bin/sh
      set -e
      D=/mnt/nas/photos-app/backups
      F="$D/memoriesbk-$(date +%F).dump"
      mkdir -p "$D"
      cd /home/freebox/photos
      docker compose exec -T postgres pg_dump -U photos -Fc photos > "$F.tmp"
      docker compose exec -T postgres pg_restore --list < "$F.tmp" >/dev/null  # fichier relisible, sinon échec
      mv "$F.tmp" "$F"
      ls -1t "$D"/memoriesbk-*.dump | tail -n +15 | xargs -r rm --
      logger -t photos-backup "ok $F $(du -h "$F" | cut -f1)"
  - path: /etc/systemd/system/photos-backup.service
    content: |
      [Unit]
      Description=Sauvegarde de la base MemoriesBK vers le NAS
      After=docker.service mnt-nas.mount
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/photos-backup
  - path: /etc/systemd/system/photos-backup.timer
    content: |
      [Unit]
      Description=Sauvegarde de la base chaque nuit
      [Timer]
      OnCalendar=*-*-* 03:30
      Persistent=true
      [Install]
      WantedBy=timers.target
  # Alertes sur le téléphone (app ntfy) : API en panne, worker tué (OOM), réseau relancé, sauvegarde ratée.
  # Désactivé tant que /etc/photos-alert.conf ne contient pas NTFY_URL=https://ntfy.sh/<sujet-secret>.
  - path: /usr/local/bin/photos-alert
    permissions: "0755"
    content: |
      #!/bin/sh
      [ -r /etc/photos-alert.conf ] && . /etc/photos-alert.conf
      [ -n "$NTFY_URL" ] || exit 0
      STATE=/var/lib/photos-alert; mkdir -p "$STATE"
      SINCE=$(cat "$STATE/since" 2>/dev/null || echo "-10min"); date "+%Y-%m-%d %H:%M:%S" > "$STATE/since"
      MSG=""
      curl -sf -m 10 localhost:8080/api/v1/health >/dev/null || MSG="$MSG API injoignable ou base/Redis en panne."
      journalctl -k --since "$SINCE" | grep -q "Killed process.*celery" && MSG="$MSG Worker tué (mémoire), relancé automatiquement."
      journalctl -t net-watchdog --since "$SINCE" | grep -q "relance" && MSG="$MSG Réseau de la VM relancé."
      systemctl is-failed -q photos-backup.service && MSG="$MSG Sauvegarde de la base en échec."
      [ -z "$MSG" ] && { rm -f "$STATE/last"; exit 0; }
      [ "$MSG" = "$(cat "$STATE/last" 2>/dev/null)" ] && exit 0   # même problème : une seule alerte
      echo "$MSG" > "$STATE/last"
      curl -sf -m 10 -H "Title: MemoriesBK" -d "$MSG" "$NTFY_URL" >/dev/null
  - path: /etc/systemd/system/photos-alert.service
    content: |
      [Unit]
      Description=Alertes MemoriesBK (ntfy)
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/photos-alert
  - path: /etc/systemd/system/photos-alert.timer
    content: |
      [Unit]
      Description=Verifie MemoriesBK toutes les 5 minutes
      [Timer]
      OnBootSec=3min
      OnUnitActiveSec=5min
      [Install]
      WantedBy=timers.target

runcmd:
  - systemctl daemon-reload && systemctl enable --now net-watchdog.timer photos-backup.timer photos-alert.timer
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker freebox
  - systemctl enable --now docker
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' > /etc/sysctl.d/99-photos.conf
  - mkdir -p /srv/photos && chown freebox:freebox /srv/photos
  - touch /var/lib/cloud/instance/photos-ready
