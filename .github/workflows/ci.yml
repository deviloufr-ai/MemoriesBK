# Depuis une copie propre du dépôt : aurait détecté le dossier Android data/ jamais suivi par git (.gitignore).
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests unitaires purs (sans base ni modèles) ; test_integration.py tourne sur la VM via deploy.sh
      - run: pip install pytest==8.3.4
      - run: python -m pytest -q test_util.py test_metadata.py
        working-directory: server
      - run: python -m py_compile *.py
        working-directory: server

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Debug : la clé release n'est pas (et ne doit pas être) dans le dépôt
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
